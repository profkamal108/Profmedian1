<!DOCTYPE html>
<html lang="en">
   <head>
     <meta charset="utf-8">
     <meta name="viewport"
       content="width=device-width,initial-scale = 1.0">
     <title>form.html</title>
   </head>
   <body>
     <h1>ATL___School</h1>
     <h2>Sign Up </h2>
     <p>Create an account to get started on your learning journey</p>
     <p>Important: Your name will appear on your certificate exactly as entered</p>
      <div>
        <form>
          <div>
            <label for="email">Email</label>
            <input placeholder="john.doe@example.com" id="email" type="text" name="email">
          </div><br>

          <div>
            <label for="firstname">First Name</label>
            <input placeholder="John" id="firstname" type="text" name="firstName"><br>
          </div><br>
          <div>
            <label for="lastname">Last Name</label>
            <input placeholder="Doe" id="lastname" type="text" name="lastName">
           </div><br>

          <div>
            <label for="phonenumber">Phone Number</label>
            <input placeholder="+1234567890" id="phonenumber" type="text" name="phonenumber">
          </div><br>

          <div>
            <label for="password">Password</label>
            <input placeholder="******" id="password" type="password" name="password">
          </div><br>
          <p>By clicking Create account, I agree to <a href="terms.html">Terms of Use</a> and acknowledge that I have read the <a href="privacy_policy.html">Privacy Policy</a>.</p>
          <button type="submit">Create Account</button>
        </form>
      </div>
   </body>
</html>
